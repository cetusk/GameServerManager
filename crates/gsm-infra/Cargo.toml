[package]
name = "gsm-infra"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[dependencies]
sha2 = "0.10"
gsm-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
fs2.workspace = true
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_Security"] }
